[SELECTION]
# ==== author matching ====
# this will take a lot of time...
run_author_match = false
# the score assigned to papers filtered by author matching, this influences the final ranking of papers (20 means always rank top)
author_match_score = 20

# ==== gpt matching ====
run_openai = true
run_title_filter = true
run_abstract_filter = true
# Only the [LLM] backend = openai path calls a model by this name; the default
# backend resolves its own and ignores this key. Kept current regardless.
model = gpt-5.6

# number of calls to gpt per minute (-1 denotes no limit)
limit_per_minute = -1

# cost quality tradeoff - larger batches are cheaper but less accurate.
title_batch_size = 32
abstract_batch_size = 16
# Off: bigger batches trade accuracy for fewer calls, which is wrong when calls
# cost wall clock. Measured, a scaled batch of 32 took 995s against a 600s budget.
adaptive_batch_size = false
adaptive_threshold = 32

# Re-ask for papers whose scores came back unparseable. One pass, not three:
# each pass is a full round of chain calls, and the chain already retries across
# providers internally, so three passes multiplied the same failure out.
title_retry = 1
abstract_retry = 1

[FILTERING]
# https://arxiv.org/category_taxonomy
arxiv_category = cs.LG,cs.AI
# type of papers on arxiv to preserve: new, cross, replace, replace-cross.
announce_type = new,cross
force_primary = false
h_cutoff = 10
relevance_cutoff = 6
novelty_cutoff = 6

[PAPER_FILTER]
# Paper-filtering modality. api_only reproduces the historical pipeline exactly (default, zero behavior change).
# agent_only routes every surviving paper through the Claude Code agent (highest quality, highest cost).
# cascade runs Rule -> Api cheap scoring, and only escalates the borderline band [low, high) to the agent.
mode = api_only
# Borderline band on the API RELEVANCE score (same 1..10 scale). A paper whose API relevance is
# >= agent_borderline_low and < agent_borderline_high is "uncertain" and (in cascade mode) gets the agent.
agent_borderline_low = 6.0
agent_borderline_high = 8.0

[OUTPUT]
debug_messages = false
output_path = out/
dump_debug_file = false
dump_json = true
dump_md = true
push_to_slack = false
# Weekly delta digest only. Deliberately NOT the shared push_to_slack above:
# main.py and remedy_missed_dates.py read that one and it must stay false.
push_weekly_to_slack = false

[MONTHLY_SUMMARY]
enabled = true
model = gpt-5.6
batch_size = 12
retry = 3
target_total_papers = 48
max_papers_per_category = 12
fallback_score_cutoff = 17
fallback_relevance_cutoff = 9
fallback_novelty_cutoff = 8

[HOTSPOTS]
enabled = true
# mode: auto | llm | heuristic. auto and llm both enrich through the LLM gateway
# ([LLM] backend); heuristic calls no model. "openai" is still accepted and still
# written into reports as the LLM-enriched value, but no OpenAI call is made.
mode = auto
model_enrich = gpt-5.6
model_screen = gpt-5.6
model_summarize = gpt-5.6
enrich_batch_size = 20
retry = 3
freshness_hours = 30
max_item_age_days = 14
target_topics = 3
min_topics = 3
target_watchlist_topics = 2
target_category_topics = 16
max_topics_per_category = 5
max_raw_items = 240
screening_auto_keep_score_cutoff = 7.2
screening_auto_keep_confidence_cutoff = 6.4
screening_auto_keep_evidence_cutoff = 5.4
screening_auto_watchlist_score_cutoff = 4.6
screening_auto_watchlist_confidence_cutoff = 5.4
screening_auto_drop_score_cutoff = 3.5
screening_auto_drop_confidence_cutoff = 3.6
screening_auto_drop_evidence_cutoff = 3.2
screening_heuristic_only_score_cutoff = 5.8
screening_heuristic_only_confidence_cutoff = 5.0
screening_heuristic_only_evidence_cutoff = 3.4
category_display_score_cutoff = 2.2
target_long_tail_topics = 8
max_long_tail_per_category = 8
long_tail_display_score_cutoff = 1.6
paper_spotlight_max_daily_hot = 6
paper_spotlight_max_new_frontier = 4
# Free Semantic Scholar citation-significance signal in the paper spotlight ranking
# (no key needed; degrade-safe - if S2 is unreachable the ranking is unchanged).
use_semantic_scholar_signal = true
# Run the bilingual Synthesize subagent (claude -p, NO OpenAI key). Defaults to true
# only when mode = openai; set true to use it in heuristic/zero-key mode too.
# use_synthesize_agent = false
# Optional S2 API key to lift the rate limit (env S2_API_KEY also honored). Leave blank.
semantic_scholar_api_key =

paper_spotlight_daily_hot_score_cutoff = 15
paper_spotlight_daily_hot_relevance_cutoff = 7
paper_spotlight_new_frontier_score_cutoff = 15
paper_spotlight_new_frontier_novelty_cutoff = 8
source_registry_path = configs/hotspot/roundup_sites.json

# --- Stage 2: persistent dedup & novelty gate (spec C.1-C.4) ---
# L2 rolling window (C.1)
cross_day_window_days = 14
# centroid merge threshold (C.1/C.2)
cross_day_cosine_threshold = 0.72
# C.4 R2 default
resurge_min_competitors = 3
# C.4 R2 cooldown
resurge_cooldown_days = 7
# G.7 centroid binding
embed_model_id = sentence-transformers/paraphrase-multilingual-mpnet-base-v2

# Agent Scout source tuning (read when use_agent_scout = true).
agent_scout_result_limit = 40
agent_scout_timeout_s = 300
# Subagent-routed source tuning (read when use_subagent_routes = true).
subagent_source_result_limit = 10
subagent_source_timeout_s = 300
# Optional override for the market-intel skill dir the scout reuses for its source matrix.
# Leave blank to auto-locate (~/.claude/skills/market-intel, then ~/CodesSelf/market-intel).
market_intel_skill_dir =

[HOTSPOT_SOURCES]
use_local_papers = true
use_hf_papers = true
use_ainews = true
use_official_blogs = true
# Weights on a hub ARE the release for labs that publish no post.
use_model_hubs = true
use_roundup_sites = true
use_analysis_feeds = true
use_reddit = true
use_x_ainews_twitter = true
# X/Twitter direct channel: twitterapi.io (managed, ~$0.15/1k tweets, set TWITTERAPI_IO_KEY).
# (Replaced the retired x_official / x_paperpulse sources, now removed.)
use_twitterapi = true
# Agent Scout: claude -p web research (WebSearch/WebFetch) for X/social + breaking
# news without an API key. Uses the local claude CLI. Default off.
use_agent_scout = false
# Reuse the market-intel skill's curated source matrix in the scout prompt (broader,
# refreshable discovery). Falls back to a built-in venue list if the skill is absent.
use_market_intel_sources = true
# Route KNOWN-FAIL sources (reddit bot-wall, JS sites) through the playwright/agent
# subagent instead of their failing direct scraper. Uses the local claude CLI.
# Default off; when on, reddit is served by the browser subagent (not the 403-ing scraper).
use_subagent_routes = false
use_github = true
use_hn = true
reuse_cached_raw = true
local_papers_max_staleness_days = 2
hf_result_limit = 12

[HOTSPOT_X]
authority_seeds_path = configs/hotspot/x_authority_seeds.json
authority_inventory_path = configs/hotspot/x_authority_inventory.json
authority_registry_max_age_hours = 24
list_result_limit = 80

[HOTSPOT_GITHUB]
search_queries = llm,agent,reasoning,multimodal,moe,quantization,benchmark,open-source model,language model,transformer,neural network
stars_cutoff = 80
created_within_days = 5
result_limit = 15

[HOTSPOT_HN]
keyword_filter = llm,openai,anthropic,deepmind,gemini,agent,reasoning,benchmark,arxiv,model,transformer
story_limit = 80
score_cutoff = 30
comments_cutoff = 8

[HOTSPOT_REUSE]
# Aggregate competitors' finished daily output as a first-class ingestion tier.
# Each reuse item is forced through the same DateVerify + max_age gate (spec D.1).
use_reuse_layer = true
reuse_sources = hf_daily,ainews,agents_radar,horizon,scholar_inbox

[HOTSPOT_RUNTIME]
# local|actions - local: VPS generates, Actions publishes only
runtime = local

[READER]
# Reader model: the weekly digest keeps only items that would CHANGE one of the
# question documents under questions_dir. Those documents are human-authored;
# no agent and no pipeline stage ever writes to them.
enabled = true
questions_dir = configs/reader/questions
# An item enters the weekly digest only when its delta score reaches this value.
# Everything below it still goes to the archive, unchanged.
delta_score_cutoff = 7
# Hard caps on the weekly digest. Sorted by delta_score, then by the pipeline's
# own score (NOVELTY for papers, FINAL_SCORE for hotspot topics).
max_deep_read = 5
max_skim = 15
# Blank = fall back to [AGENT] model. Delta scoring runs on the claude -p
# subagent transport so it works in the zero-key profile too.
model =
timeout_s = 180
# Daily kernel/paper runs only ANNOTATE items with a delta score; they never
# drop anything. Set false to skip annotation entirely (the weekly digest then
# scores from scratch).
annotate_in_daily_run = true

[LLM]
# Which transport carries every model call.
#   auto     (default) llmcall if importable, else this repo's claude -p transport.
#            Never falls back to openai: a dead key must surface as an outage.
#   llmcall  the llmcall package, no API key
#   agent    this repo's claude -p transport, works on a bare clone
#   openai   the historical HTTP path; requires OPENAI_API_KEY
backend = auto
# Reasoning tier. Relevance, novelty and delta scoring are judgements: keep it top.
effort = max
# Blank = let the backend pick (llmcall reads its own single source of truth).
model =
# Budget for the WHOLE chain, not per provider: it is split across the legs, so
# the first one sees a slice. Measured over 990 successful answers: median 134s,
# p95 428s, max 542s -- a 420s budget still catches 94.6% of them while cutting
# what a doomed call costs, and doomed calls burned 49 of the 96 hours spent.
timeout_s = 420
