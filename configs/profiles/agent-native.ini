# Zero-key agent-native profile.
# Copy this over configs/config.ini for a no-API-key VPS deploy:
#   cp configs/profiles/agent-native.ini configs/config.ini
# Papers are filtered by a Claude subagent (PAPER_FILTER mode = agent_only).
# X/social + breadth come from the agent scout (WebSearch/WebFetch).
# Bilingual headlines come from the Synthesize agent. No OpenAI or twitterapi keys.
# Needs only the claude CLI (logged in) + a git push token. PURE ASCII.

[SELECTION]
run_author_match = false
author_match_score = 20
# run_openai stays true to ENABLE the paper-filter step in main.py (it is the outer gate
# around the whole [PAPER_FILTER] dispatch). With [PAPER_FILTER] mode = agent_only, that
# dispatch routes every paper to the Claude subagent instead of OpenAI -- cascade_filter's
# agent_only branch never calls the API scorer, so NO OPENAI_API_KEY is needed.
run_openai = true
run_title_filter = true
run_abstract_filter = true
# Unused in agent_only mode (the API scorer is never invoked); kept for schema completeness.
model = gpt-5.4
limit_per_minute = 10
title_batch_size = 8
abstract_batch_size = 4
adaptive_batch_size = true
adaptive_threshold = 32
title_retry = 3
abstract_retry = 3

[FILTERING]
# e.g., cs.LG,cs.AI
arxiv_category =
announce_type = new,cross
force_primary = false
h_cutoff = 0
relevance_cutoff = 6
novelty_cutoff = 6

[PAPER_FILTER]
# agent_only routes every surviving paper through the Claude Code agent (no OpenAI key).
mode = agent_only
agent_borderline_low = 6.0
agent_borderline_high = 8.0

[OUTPUT]
debug_messages = false
output_path = out/
dump_debug_file = false
dump_json = true
dump_md = true
push_to_slack = false

[HOTSPOTS]
enabled = true
# heuristic: no OpenAI screening/enrichment; the Synthesize agent still runs.
mode = heuristic
# Use the claude -p Synthesize agent for bilingual headlines (no OpenAI key needed).
use_synthesize_agent = true
model_screen = gpt-4o
model_summarize = gpt-4o
retry = 3
freshness_hours = 36
# Hard upper bound on item age (days) measured from the day-granular verified
# first-publication date (gate_date). Items older than this are dropped before
# scoring; github_trend is exempt. Spec B.5.
max_item_age_days = 14
target_topics = 5
min_topics = 3
target_watchlist_topics = 3
target_items_per_topic = 4
max_raw_items = 120
max_clusters_for_llm = 18
screen_batch_size = 6
screening_score_cutoff = 4.0
watchlist_score_cutoff = 3.3
source_registry_path = configs/hotspot/roundup_sites.json

# --- Stage 2: persistent dedup & novelty gate (spec C.1-C.4) ---
# L2 rolling window (C.1)
cross_day_window_days = 14
# centroid merge threshold (C.1/C.2)
cross_day_cosine_threshold = 0.72
# C.4 R2 default
resurge_min_competitors = 3
# C.4 R2 cooldown
resurge_cooldown_days = 7
# G.7 centroid binding; keep in sync with embed.py EMBED_MODEL_ID
embed_model_id = sentence-transformers/paraphrase-multilingual-mpnet-base-v2

# Agent Scout source tuning (read when use_agent_scout = true).
agent_scout_result_limit = 40
agent_scout_timeout_s = 300
# Subagent-routed source tuning (read when use_subagent_routes = true).
subagent_source_result_limit = 10
subagent_source_timeout_s = 300

[HOTSPOT_SOURCES]
use_local_papers = true
use_hf_papers = true
use_ainews = true
use_official_blogs = true
use_roundup_sites = true
use_x_ainews_twitter = true
# No twitterapi.io key: the agent scout covers X/social instead.
use_twitterapi = false
# Agent Scout: claude -p web research (WebSearch/WebFetch). Runs on the Claude
# subscription, needs no API key. This is the X/social + breaking-news source here.
use_agent_scout = true
# Route reddit (bot-wall) + JS sites through the playwright/agent subagent (no key needed).
use_subagent_routes = true
use_github = true
use_hn = true
reuse_cached_raw = true
local_papers_max_staleness_days = 2
hf_result_limit = 24

[HOTSPOT_X]
authority_seeds_path = configs/hotspot/x_authority_seeds.json
authority_inventory_path = configs/hotspot/x_authority_inventory.json
authority_registry_max_age_hours = 24
list_result_limit = 80
official_batch_size = 10
researcher_batch_size = 8
paperpulse_result_limit = 20

[HOTSPOT_GITHUB]
search_queries = llm,agent,reasoning,multimodal,moe,quantization,benchmark,open-source model
stars_cutoff = 20
created_within_days = 10
result_limit = 30

[HOTSPOT_HN]
keyword_filter = llm,openai,anthropic,deepmind,gemini,agent,reasoning,benchmark,arxiv,model,transformer
story_limit = 80
score_cutoff = 30
comments_cutoff = 8

[HOTSPOT_REUSE]
# Aggregate competitors' finished daily output as a first-class ingestion tier.
# Each reuse item is forced through the same DateVerify + max_age gate (spec D.1).
use_reuse_layer = true
reuse_sources = hf_daily,ainews,agents_radar,horizon,scholar_inbox

[HOTSPOT_RUNTIME]
# local|actions - local: VPS generates, Actions publishes only
runtime = local
